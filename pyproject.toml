[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eureka-eml"
version = "0.1.0"
description = "Discover interpretable equations from data using EML symbolic regression"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "sympy>=1.12",
    "numpy>=1.24",
    "pandas>=2.0",
    "click>=8.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.30", "plotly>=5.0"]
dev = ["pytest>=7.0"]

[project.scripts]
eureka = "eureka.cli:main"

[tool.setuptools.packages.find]
include = ["eureka*"]
